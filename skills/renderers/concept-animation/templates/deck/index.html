<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
    html, body { margin: 0; height: 100%; background: #e8e5de; overflow: hidden; }
    body { display: grid; place-items: center; font-family: "IBM Plex Sans", system-ui, sans-serif; color: #1d2026; }
    canvas { display: block; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    #notes {
      position: fixed; right: 0; bottom: 0; width: min(560px, 100%); max-height: 55vh; overflow: auto;
      box-sizing: border-box; padding: 20px 24px; background: #fffdf9; border: 1px solid #c9c2b3;
      font-size: 18px; line-height: 1.45; box-shadow: 0 -2px 0 rgba(0,0,0,.02);
    }
    #notes h2 { margin: 0 0 8px; font-size: 16px; font-family: "IBM Plex Mono", monospace; font-weight: 500; color: #595d66; }
    #notes ol { margin: 0 0 12px; padding-left: 22px; }
    #notes li { color: #595d66; }
    #notes li[aria-current] { color: #1d2026; font-weight: 600; }
    #notes p { margin: 0; }
    @media print { #notes { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1 id="slide-title" class="sr-only">{{TITLE}}</h1>
    <canvas id="stage" aria-hidden="true"></canvas>
    <p class="sr-only">Keyboard: Right arrow, Space or Page Down for the next step. Left arrow or Page Up for the previous step. R restarts from the first slide. N toggles speaker notes. F toggles full screen. M toggles reduced motion.</p>
    <div id="caption" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <aside id="notes" aria-label="Speaker notes" hidden></aside>
  </main>
  <script src="engine/easing.js"></script>
  <script src="engine/theme.js"></script>
  <script src="engine/draw.js"></script>
  <script src="engine/objects.js"></script>
  <script src="engine/deck.js"></script>
  <script src="slides/01-example.js"></script>
  <script>Deck.start();</script>
</body>
</html>
