<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__UI_CAPTURE_TITLE__ · UI Capture</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8; --surface: #fff; --fg: #17202a; --muted: #4a5763; --line: #d4d9de; --accent: #0b5cad; --warn-bg: #fff4e5; --warn-fg: #7a4100;
      --pele-bg: transparent; --pele-fg: #17202a; --pele-muted: #4a5763; --pele-line: #5b6873; --pele-surface: #ffffff; --pele-surface-alt: #eef1f4; --pele-border: #9aa6b1;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
    header.page { padding: 2rem 0 1rem; }
    h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); line-height: 1.15; margin: 0 0 .5rem; }
    h2 { font-size: 1.35rem; margin: 0 0 .25rem; }
    .meta { color: var(--muted); margin: 0; }
    .toolbar { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
    .toolbar .wrap { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; padding-block: .6rem; }
    fieldset.viewports { border: 0; margin: 0; padding: 0; display: flex; gap: .25rem; align-items: center; flex-wrap: wrap; }
    fieldset.viewports legend { float: left; margin-right: .5rem; font-weight: 600; }
    .viewports label { position: relative; }
    .viewports input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .viewports span { display: inline-block; padding: .3rem .7rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-variant-numeric: tabular-nums; }
    .viewports input:checked + span { background: var(--fg); color: #fff; border-color: var(--fg); }
    .viewports input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
    nav.jump { display: flex; gap: .25rem 1rem; overflow-x: auto; white-space: nowrap; max-width: 100%; }
    nav.jump a { color: var(--accent); }
    @media (max-width: 700px) { fieldset.viewports legend { float: none; width: 100%; } .toolbar .wrap { gap: .4rem; } }
    section.card { scroll-margin-top: 7rem; background: var(--surface); border: 1px solid var(--line); border-radius: .75rem; padding: 1.25rem; margin: 1.25rem 0; }
    .map-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--fg); background: var(--fg); color: #fff; border-radius: .5rem; padding: .45rem .9rem; }
    button.secondary { background: var(--surface); color: var(--fg); border-color: var(--line); }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #diagram { margin-top: 1rem; overflow-x: auto; }
    #diagram svg { max-width: 100%; height: auto; }
    .legend { color: var(--muted); font-size: .9rem; margin: .5rem 0 0; }
    .badge { display: inline-block; font-size: .8rem; font-weight: 600; padding: .1rem .5rem; border-radius: 999px; background: #e7eef6; color: #123b63; vertical-align: middle; }
    .badge.branch { background: #efe9f7; color: #4a2373; }
    .badge.auto { background: #eef1f4; color: #3d4b56; }
    table.coverage { width: 100%; border-collapse: collapse; font-size: .92rem; }
    table.coverage th, table.coverage td { text-align: left; vertical-align: top; padding: .45rem .5rem; border-bottom: 1px solid var(--line); }
    table.coverage th[scope=col] { font-weight: 600; color: var(--muted); }
    table.coverage td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .table-wrap { overflow-x: auto; }
    .note { background: var(--warn-bg); color: var(--warn-fg); border-radius: .5rem; padding: .5rem .75rem; margin: .75rem 0 0; }
    details.inherited { margin: .75rem 0; color: var(--muted); }
    details.inherited summary { cursor: pointer; }
    ol.steps { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--col, 300px)), 1fr)); gap: 1rem; }
    ol.steps li { display: flex; flex-direction: column; gap: .4rem; }
    .action { font-size: .9rem; color: var(--muted); }
    .action strong { color: var(--fg); }
    figure { margin: 0; }
    figure img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; object-position: top; background: #fff; border: 1px solid var(--line); border-radius: .4rem; }
    figcaption { font-weight: 600; margin-top: .35rem; }
    .fallback { font-size: .8rem; color: var(--warn-fg); font-weight: 400; display: block; }
    .video { margin-top: 1.25rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    .video video { display: block; width: 100%; max-width: var(--vw, 960px); max-height: 75vh; background: #000; border-radius: .5rem; }
    .chapters { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0 0; padding: 0; list-style: none; }
    .chapters button { font-size: .85rem; padding: .25rem .6rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  </style>
  __UI_CAPTURE_PELE__
</head>
<body>
  <header class="page wrap">
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
  </header>
  <div class="toolbar">
    <div class="wrap">
      <fieldset class="viewports" id="viewports"><legend>Viewport</legend></fieldset>
      <nav class="jump" aria-label="Sections" id="jump"></nav>
    </div>
  </div>
  <main class="wrap">
    <section class="card" aria-labelledby="map-heading" id="map">
      <div class="map-head">
        <h2 id="map-heading">Flow map</h2>
        <div><button type="button" id="copy">Copy flow map</button> <span id="copy-status" role="status" class="meta"></span></div>
      </div>
      <div id="diagram" role="img" aria-labelledby="map-heading map-desc"></div>
      <p class="legend" id="map-desc"></p>
    </section>
    <div id="branches"></div>
    <section class="card" aria-labelledby="coverage-heading" id="coverage">
      <h2 id="coverage-heading">Coverage</h2>
      <p class="meta" id="coverage-summary"></p>
      <div class="table-wrap"><table class="coverage"><caption class="sr-only">Explored and unexplored actions per screen</caption>
        <thead><tr><th scope="col">Screen</th><th scope="col">Explored</th><th scope="col">Not explored</th><th scope="col">Skipped on purpose</th></tr></thead>
        <tbody id="coverage-rows"></tbody></table></div>
    </section>
  </main>
  <script>window.__UI_CAPTURE__ = __UI_CAPTURE_DATA__;</script>
  <script>
  (() => {
    const data = window.__UI_CAPTURE__;
    const $ = (tag, attrs = {}, ...kids) => { const el = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (v == null) continue; if (k === "text") el.textContent = v; else if (k === "class") el.className = v; else el.setAttribute(k, v); } el.append(...kids.filter(Boolean)); return el; };
    const node = (id) => data.nodes.find((n) => n.id === id) || { id, title: id };
    const widths = data.viewports.map((v) => v.width);
    let width = data.primary;

    document.querySelector("#title").textContent = data.goal;
    const when = data.captured ? new Date(data.captured).toLocaleString() : "";
    document.querySelector("#meta").textContent = [data.role && `Role: ${data.role}`, data.host, when, `${data.nodes.length} screens`, `${data.branches.length || 1} ${data.branches.length === 1 ? "path" : "paths"}`].filter(Boolean).join(" · ");

    // Flow map rendered by Pele; the Mermaid source is only offered through the copy button.
    const diagram = document.querySelector("#diagram");
    try { window.pele.mount(diagram, data.mermaid); } catch (error) { diagram.textContent = `Diagram could not be rendered: ${error.message}`; }
    document.querySelector("#map-desc").textContent = `${data.nodes.length} screens and ${data.edges.length} interactions.` + (data.signin ? " The dashed arrow is a human sign-in that is not recorded." : "");
    document.querySelector("#copy").addEventListener("click", async () => {
      const status = document.querySelector("#copy-status");
      try { await navigator.clipboard.writeText(data.mermaid); status.textContent = "Copied as Mermaid."; }
      catch { const area = $("textarea", { class: "sr-only" }); area.value = data.mermaid; document.body.append(area); area.select(); const ok = document.execCommand("copy"); area.remove(); status.textContent = ok ? "Copied as Mermaid." : "Copy failed; your browser blocked clipboard access."; }
      setTimeout(() => { status.textContent = ""; }, 4000);
    });

    const fieldset = document.querySelector("#viewports");
    for (const w of widths) {
      const input = $("input", { type: "radio", name: "viewport", value: String(w), "aria-label": `${w} pixels wide` });
      if (w === width) input.checked = true;
      input.addEventListener("change", () => { width = w; renderBranches(); });
      fieldset.append($("label", {}, input, $("span", { text: `${w}`, "aria-hidden": "true" })));
    }

    const shotFor = (nodeId) => {
      const shots = data.assets.filter((a) => a.node === nodeId && /\.(png|jpe?g)$/i.test(a.file));
      return { exact: shots.find((a) => a.width === width), fallback: shots.find((a) => a.width === data.primary) || shots[0] };
    };

    function screenCard(nodeId, actionText, startLabel = "Starting screen") {
      const n = node(nodeId);
      const { exact, fallback } = shotFor(nodeId);
      const shot = exact || fallback;
      const caption = $("figcaption", { text: n.title });
      if (!exact && fallback) caption.append($("span", { class: "fallback", text: `Not captured at ${width}px; showing ${fallback.width || data.primary}px.` }));
      const figure = $("figure", { id: `screen-${nodeId}-${Math.random().toString(36).slice(2, 7)}` }, shot ? $("img", { src: shot.file, alt: `${n.title} at ${shot.width || data.primary}px`, loading: "lazy" }) : $("p", { class: "note", text: "No screenshot." }), caption);
      const li = $("li", {});
      if (actionText) li.append($("p", { class: "action" }, document.createTextNode("Click "), $("strong", { text: `“${actionText}”` })));
      else li.append($("p", { class: "action", text: startLabel }));
      li.append(figure);
      return li;
    }

    function videoBlock(branch) {
      const block = $("div", { class: "video" }, $("h3", { text: `Recording · ${width}px` }));
      const vp = data.viewports.find((v) => v.width === width);
      const rec = branch.videos?.[width];
      if (!vp?.video) { block.append($("p", { class: "meta", text: `No video at ${width}px: this width is captured as stills for WCAG 1.4.10 reflow only.` })); return block; }
      if (!rec) { block.append($("p", { class: "meta", text: branch.breaks?.[width] ? "No video: the replay broke at this width (see note above)." : "Not recorded yet. Run replay." })); return block; }
      const video = $("video", { controls: "", preload: "metadata", src: rec.file, "aria-label": `${branch.name}, screen recording at ${width}px` });
      video.style.setProperty("--vw", `${Math.min(width, 960)}px`);
      block.append(video);
      if (rec.chapters?.length) {
        const list = $("ul", { class: "chapters", "aria-label": "Chapters" });
        for (const ch of rec.chapters) {
          const btn = $("button", { type: "button", class: "secondary", text: `${ch.label} · ${Math.floor(ch.time / 60)}:${String(Math.floor(ch.time % 60)).padStart(2, "0")}` });
          btn.addEventListener("click", () => { video.currentTime = ch.time; video.play().catch(() => {}); });
          list.append($("li", {}, btn));
        }
        block.append(list);
      }
      return block;
    }

    function renderBranches() {
      const root = document.querySelector("#branches");
      root.replaceChildren();
      const jump = document.querySelector("#jump");
      jump.replaceChildren($("a", { href: "#map", text: "Flow map" }));
      const branches = data.branches.length ? data.branches : [{ id: "all", name: "Captured screens", kind: "main", steps: [], videos: {}, breaks: {} }];
      for (const branch of branches) {
        const id = `branch-${branch.id}`;
        jump.append($("a", { href: `#${id}`, text: branch.name }));
        const section = $("section", { class: "card", id, "aria-labelledby": `${id}-h` });
        const isMain = branch.kind === "main";
        const badge = isMain ? ["", "Main path"] : branch.kind === "auto" ? [" auto", "Explored automatically"] : [" branch", "Branch"];
        section.append($("h2", { id: `${id}-h` }, document.createTextNode(`${branch.name} `), $("span", { class: `badge${badge[0]}`, text: badge[1] })));
        if (!isMain && branch.fork) section.append($("p", { class: "meta", text: `Branches off at “${node(branch.fork).title}”.` }));
        if (branch.breaks?.[width]) section.append($("p", { class: "note", text: branch.breaks[width] }));
        const own = branch.steps.filter((s) => !s.inherited);
        const inherited = branch.steps.filter((s) => s.inherited);
        const list = $("ol", { class: "steps" });
        list.style.setProperty("--col", width <= 400 ? "200px" : width <= 800 ? "260px" : "320px");
        if (isMain || !branch.steps.length) {
          if (data.signin && isMain) list.append(screenCard(data.signin, null));
          if (data.start) list.append(screenCard(data.start, data.signin && isMain ? "Sign in (human, not recorded)" : null));
          if (!data.branches.length) for (const n of data.nodes.filter((n) => n.id !== data.start && n.id !== data.signin)) list.append(screenCard(n.id, null));
        } else if (inherited.length) {
          const details = $("details", { class: "inherited" }, $("summary", { text: `Same as the path above for ${inherited.length} ${inherited.length === 1 ? "step" : "steps"}, up to “${node(branch.fork).title}”` }));
          const sub = $("ol", { class: "steps" });
          sub.style.setProperty("--col", "200px");
          for (const s of inherited) sub.append(screenCard(s.to, s.action));
          details.append(sub);
          section.append(details);
          list.append(screenCard(branch.fork, null, "Branches from here"));
        }
        for (const s of own) list.append(screenCard(s.to, s.action));
        section.append(list);
        if (branch.steps.length && branch.kind !== "auto") section.append(videoBlock(branch));
        root.append(section);
      }
      jump.append($("a", { href: "#coverage", text: "Coverage" }));
    }
    renderBranches();

    const rows = document.querySelector("#coverage-rows");
    const cov = data.coverage || [];
    const explored = cov.reduce((sum, row) => sum + row.explored, 0);
    const open = cov.reduce((sum, row) => sum + row.unexplored.length, 0);
    document.querySelector("#coverage-summary").textContent = cov.length ? `${explored} of ${explored + open} relevant actions explored across ${cov.length} screens. Global header controls, pagination and viewer controls are not counted.` : "No coverage data yet. Run render after exploring.";
    for (const row of cov) {
      rows.append($("tr", {}, $("th", { scope: "row", text: row.screen }), $("td", { class: "num", text: String(row.explored) }), $("td", { text: row.unexplored.join(", ") || "—" }), $("td", { text: row.skipped.join(", ") || "—" })));
    }
  })();
  </script>
</body>
</html>
